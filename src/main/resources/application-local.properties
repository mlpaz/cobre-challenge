# Más tiempo que el default (10s) para poder mirar el estado OPEN del circuit
# breaker con calma en pruebas locales, antes de que pase a HALF_OPEN.
notification.webhook.circuit-breaker.wait-duration-in-open-state=1m

# Local Kafka broker (e.g. docker compose / redpanda).
spring.kafka.bootstrap-servers=localhost:9092

# Local PostgreSQL, started via docker-compose.yml.
spring.datasource.url=jdbc:postgresql://localhost:5438/notification
spring.datasource.username=notification
spring.datasource.password=notification
