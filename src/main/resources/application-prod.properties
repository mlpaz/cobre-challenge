# Production Notification Provider.
notification.provider.base-url=https://notification-provider.cobre.com

# More conservative in prod: fewer retries, breaker trips sooner.
notification.provider.retry.max-attempts=2
notification.provider.circuit-breaker.failure-rate-threshold=40
notification.provider.circuit-breaker.minimum-number-of-calls=10
notification.provider.circuit-breaker.wait-duration-in-open-state=30s
