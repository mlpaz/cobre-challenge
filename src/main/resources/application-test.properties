# Test/QA Kafka cluster.
spring.kafka.bootstrap-servers=kafka.test.cobre.com:9092

# Test/QA PostgreSQL. Credentials come from the environment, never hardcoded.
spring.datasource.url=jdbc:postgresql://notification-db.test.cobre.com:5432/notification
spring.datasource.username=notification
spring.datasource.password=${DB_PASSWORD}
