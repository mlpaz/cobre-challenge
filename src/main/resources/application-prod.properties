# Production Kafka cluster.
spring.kafka.bootstrap-servers=kafka.cobre.com:9092

# Production PostgreSQL. Credentials come from the environment, never hardcoded.
spring.datasource.url=jdbc:postgresql://notification-db.cobre.com:5432/notification
spring.datasource.username=notification
spring.datasource.password=${DB_PASSWORD}

# Production Redis (see IdempotencyCacheConfig): shared across every instance,
# unlike the in-memory stand-in used locally.
spring.data.redis.host=notification-idempotency.cobre.com
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

# More conservative in prod: fewer retries, webhook breaker trips sooner.
notification.webhook.delivery.retry.max-attempts=2
notification.webhook.circuit-breaker.min-success-score=60
notification.webhook.circuit-breaker.minimum-number-of-calls=10
notification.webhook.circuit-breaker.wait-duration-in-open-state=30s
