spring.application.name=notification
spring.profiles.active=local

# All I/O in this service is blocking (RestClient, servlet). Virtual threads let
# Tomcat and blocking task executors scale without needing a reactive stack.
spring.threads.virtual.enabled=true

spring.jackson.property-naming-strategy=SNAKE_CASE

# Persistence (see NotificationRecordPort / NotificationRecordJpaAdapter):
# stores the final outcome of every processed notification event. Schema is
# owned by Flyway migrations, never by Hibernate, so ddl-auto only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Idempotency guard (see IdempotencyPort / InMemoryIdempotencyStore): protects
# against duplicate delivery when the same event arrives more than once
# (Kafka at-least-once redelivery, a resend from the platform, etc). Keyed by
# client_id + event_id, the natural identifier of one event occurrence.
idempotency.ttl=1m

# Kafka input adapter (see NotificationEventKafkaListener): the platform
# publishes generated events here instead of calling us over HTTP.
notification.events.topic=notification-events
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

# Subscription registry outbound HTTP client (see SubscriptionHttpClient).
# Confirms an event has an active subscription for its (client_id, event_type)
# before it is delivered; also guarantees the event actually belongs to that client.
subscription.service.path=/subscriptions
subscription.service.connect-timeout=1s
subscription.service.read-timeout=2s

# Notification Provider outbound HTTP client (see NotificationProviderHttpClient).
notification.provider.path=/notifications
notification.provider.connect-timeout=2s
notification.provider.read-timeout=3s

notification.provider.retry.max-attempts=3
notification.provider.retry.wait-duration=200ms
notification.provider.retry.exponential-backoff-multiplier=2.0

notification.provider.circuit-breaker.failure-rate-threshold=50
notification.provider.circuit-breaker.sliding-window-size=10
notification.provider.circuit-breaker.minimum-number-of-calls=5
notification.provider.circuit-breaker.wait-duration-in-open-state=10s
notification.provider.circuit-breaker.permitted-number-of-calls-in-half-open-state=3
