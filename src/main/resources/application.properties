spring.application.name=notification
spring.profiles.active=local

# All I/O in this service is blocking (RestClient, servlet). Virtual threads let
# Tomcat and blocking task executors scale without needing a reactive stack.
spring.threads.virtual.enabled=true

spring.jackson.property-naming-strategy=SNAKE_CASE

# Persistence (see NotificationRecordPort / NotificationRecordJpaAdapter):
# stores the final outcome of every processed notification event. Schema is
# owned by Flyway migrations, never by Hibernate, so ddl-auto only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Idempotency guard (see IdempotencyPort / InMemoryIdempotencyStore): protects
# against duplicate delivery when the same event arrives more than once
# (Kafka at-least-once redelivery, a resend from the platform, etc). Keyed by
# event_id, unique platform-wide.
idempotency.ttl=1h

# Notification events listing (see NotificationController#list): caps how many
# rows and how deep into the result set a single request can pull, so a client
# can't force a full, unpaginated scan of the table.
notification.events.query.default-limit=20
notification.events.query.max-limit=100
notification.events.query.max-offset=10000

# Kafka input adapter (see NotificationEventKafkaListener): the platform
# publishes generated events here instead of calling us over HTTP.
notification.events.topic=notification-events
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

# Metrics (see MetricsPort / DatadogMetricsAdapter): emitted via DogStatsD to
# a local Datadog Agent. The port is a domain abstraction — Datadog is just
# today's implementation.
datadog.metrics.host=localhost
datadog.metrics.port=8125
datadog.metrics.prefix=notification

# Notification Provider outbound HTTP client (see NotificationProviderHttpClient).
notification.provider.path=/notifications
notification.provider.connect-timeout=2s
notification.provider.read-timeout=3s

notification.provider.retry.max-attempts=3
notification.provider.retry.wait-duration=200ms
notification.provider.retry.exponential-backoff-multiplier=2.0

# Per-webhook circuit breaker (see WebhookCircuitBreakerPort /
# WebhookCircuitBreakerJpaAdapter): each subscription tracks its own success
# score, so one client's broken webhook can't short-circuit deliveries to
# every other client's webhook the way a single provider-wide breaker would.
# Manual replay (see NotificationEventReplayService) always bypasses this —
# it's the deliberate recovery path — but its outcome still feeds the score.
notification.webhook.circuit-breaker.min-success-score=50
notification.webhook.circuit-breaker.minimum-number-of-calls=5
notification.webhook.circuit-breaker.wait-duration-in-open-state=10s
notification.webhook.circuit-breaker.permitted-number-of-calls-in-half-open-state=3
notification.webhook.circuit-breaker.score-smoothing-factor=0.2

# Rate limiting (see RateLimitFilter): the public API has no authentication
# yet (see "Seguridad" in the README, A01/A07), so this is keyed by caller IP
# as a stopgap — a token bucket per IP, refilled at a steady rate, allowing
# short bursts up to "capacity". "general" covers every request under
# /notification_events and /subscriptions; "strict" overrides it (tracked
# separately per endpoint) for POST /subscriptions and POST
# /notification_events/{id}/replay, the highest-risk and most expensive ones.
rate-limit.general.capacity=60
rate-limit.general.refill-tokens=60
rate-limit.general.refill-period=1m
rate-limit.strict.capacity=5
rate-limit.strict.refill-tokens=5
rate-limit.strict.refill-period=1m
